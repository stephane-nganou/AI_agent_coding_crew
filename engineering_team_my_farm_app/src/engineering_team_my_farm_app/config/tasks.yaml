design_task:
  description: >
    Produce the full technical design and task plan for the Farm Web Application using best pratices. \n
    The requirement is this: \n
    {requirement} \n \n

    Deliverables (use FileWriterTool to write all files): \n
    1) output/docs/architecture/design.md — System overview, diagrams (textual), module boundaries, flows (auth, checkout), error handling, logging strategy.\n
    2) output/docs/architecture/data-model.md — ERD (textual), entity list w/ attributes & relationships.\n
    3) output/docs/api/openapi.yaml — REST API spec: auth, users, products, inventory, media, orders, reservations, reports, contact, blog, events, testimonials, social.\n
    4) output/docs/plan/taskplan.md — Explicit task breakdown and assign specific modules/tasks to 'backend_dev_1', 'backend_dev_2', 'frontend_dev_1', and 'frontend_dev_2' in the task plan;
    and tasks for 'frontend_tester', 'backend_tester' and finaly 'devops_engineer'. \n
    5) output/docs/ux/navigation.md — Routes, components, layouts, responsive behavior, loading/error states.\n
    6) output/docs/security/security.md — JWT/OAuth2 flows, password policies, roles/permissions, CORS, secrets, CSRF, session management.\n
    7) output/docs/dev/env.md — Local dev instructions, environment variables, ports, service URLs.\n
    8) Define explicit backend and frontend directory structures and filenames each engineer must implement.\n
    9) Include logging and exception handling guidelines and examples for both backend and frontend.\n
    Make sure to be concrete: list exact file paths and class/component names to be created by each engineer. \n
    You have in your team 2 senior backend developers ('backend_dev_1' and 'backend_dev_2'), 2 senior Angular frontend developer ('frontend_dev_1' and 'frontend_dev_2'),
    1 senior backend tester ('backend_tester'), 1 senior frontend test ('frontend_tester') and 1 senior DevOps engineer ('devops_engineer').
  expected_output: >
    Complete design and task plan documentation written to output/ with detailed design document including module breakdowns, 
    function/method signatures, and a task assignment plan for each developer, tester and devops enginneer.
  agent: engineering_lead

backend_task_dev_1:
  description: >
    Implement the backend foundation per the design. \n
    Do not write unit tests. Ensure excellent comments, docstrings, logging, and exception handling. Use FileWriterTool to create files. \n
    You follow and review strictly  the detailed design and task plan from the Engineering Lead in (output/docs/architecture/design.md and output/docs/plan/taskplan.md). \n 
    Identify and develop only the backend modules assigned to 'backend_dev_1'. Write Java 21 code with the latest Spring Boot 3.x. \n

    Acceptance:\n
    - Application builds with `mvn -q -DskipTests package`.\n
    - Entities, repositories, and core services compile and are logically cohesive.
  expected_output: >
    Java code files for the assigned backend modules created in output/backend as specified. \n

    IMPORTANT: Output ONLY the raw Java code without any markdown formatting, code block delimiters, or backticks.
    The output should be valid Java code that can be directly executed.
  agent: backend_dev_1
  context:
    - design_task

backend_task_dev_2:
  description: >
    Implement business features per the design. \n
    Do not write unit tests. \n
    Ensure excellent comments, docstrings, logging, and exception handling. Use FileWriterTool to create files. \n
    You follow and review strictly  the detailed design and task plan from the Engineering Lead in (output/docs/architecture/design.md and output/docs/plan/taskplan.md). \n 
    Identify and develop only the backend modules assigned to 'backend_dev_2'. Write Java 21 code with the latest Spring Boot 3.x. \n
  expected_output: >
    Java code files for the assigned backend modules created in output/backend as specified. \n

    IMPORTANT: Output ONLY the raw Java code without any markdown formatting, code block delimiters, or backticks.
    The output should be valid Java code that can be directly executed.
  agent: backend_dev_2
  context:
    - design_task
    - backend_task_dev_1

frontend_task_dev_1:
  description: >
    Do not write unit tests. \n
    Ensure comments, docstrings, logging, and error handling. Use FileWriterTool to create files. \n
    You follow and review strictly  the detailed design and task plan from the Engineering Lead in (output/docs/architecture/design.md and output/docs/plan/taskplan.md). \n 
    Identify and develop only the backend modules assigned to 'frontend_dev_1'. \n
    Write Angular 20 code with standalone components.
  expected_output:
    Angular code files for the assigned frontend components created in output/frontend. \n

    IMPORTANT: Output ONLY the raw Java code without any markdown formatting, code block delimiters, or backticks.
    The output should be valid Angular code that can be directly executed.
  agent: frontend_dev_1
  context:
