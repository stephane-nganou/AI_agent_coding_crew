[project]
name = "engineering_team_my_farm_app"
version = "0.1.0"
description = "engineering_team_my_farm_app using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.186.1,<1.0.0"
]

[project.scripts]
engineering_team_my_farm_app = "engineering_team_my_farm_app.main:run"
run_crew = "engineering_team_my_farm_app.main:run"
train = "engineering_team_my_farm_app.main:train"
replay = "engineering_team_my_farm_app.main:replay"
test = "engineering_team_my_farm_app.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
